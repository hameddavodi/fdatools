site_name: fdatools
site_description: Functional data analysis for Python — a clean-room rewrite of R's fda.
site_url: https://hameddavodi.github.io/fdatools/
repo_url: https://github.com/hameddavodi/fdatools
repo_name: hameddavodi/fdatools
copyright: Copyright &copy; 2026 Hamed Davodi — BSD-3-Clause
docs_dir: docs
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            members_order: source
            filters: ["!^_(?!_(call|matmul|getitem|add|mul|pow)__$)"]
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
# Developer notes live under docs/dev/ and are published but kept out of the
# user-facing navigation, except the conventions page.
not_in_nav: |
  /dev/data-release.md
  /dev/reviews/*
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Migrating from R fda: r-migration.md
  - Tutorials:
      - tutorials/index.md
      - Smoothing: tutorials/smoothing.md
      - Functional PCA and CCA: tutorials/fpca.md
      - Registration: tutorials/registration.md
      - Functional regression: tutorials/regression.md
      - Dynamics: tutorials/dynamics.md
      - Machine learning: tutorials/machine-learning.md
      - Econometrics and interop: tutorials/econometrics.md
  - API reference:
      - api/index.md
      - Basis systems: api/basis.md
      - Core objects: api/core.md
      - Smoothing: api/smoothing.md
      - Decomposition: api/decomposition.md
      - Regression: api/regression.md
      - Registration: api/registration.md
      - Dynamics: api/dynamics.md
      - Statistics: api/stats.md
      - Sparse data (PACE): api/sparse.md
      - Density and intensity: api/density.md
      - Profiling (ODE parameters): api/profiling.md
      - PyTorch layers: api/nn.md
      - Datasets: api/datasets.md
      - Input and output: api/io.md
      - Interoperability: api/interop.md
  - Developer conventions: dev/conventions.md
