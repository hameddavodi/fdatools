name: release

# Publishes a GitHub release's wheel and sdist to PyPI with trusted publishing
# (OIDC): no API token is stored anywhere. PyPI trusts exactly this file
# (release.yml) running in the `pypi` environment of hameddavodi/fdatools.
#
# - A published GitHub release uploads its own assets.
# - "Run workflow" with a tag (for example v1.1.0) uploads an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.1.0"
        required: true

permissions:
  contents: read

jobs:
  pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fdatools/
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # Upload the files attached to the release, byte for byte: they are the
      # ones that were checked before the release was made.
      - name: download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'fdatools-*.whl' --pattern 'fdatools-*.tar.gz'
          ls -l dist
      - name: check that the files match the tag
        run: |
          version="${TAG#v}"
          test -f "dist/fdatools-${version}-py3-none-any.whl"
          test -f "dist/fdatools-${version}.tar.gz"
          test "$(ls dist | wc -l)" -eq 2
          sha256sum dist/*
      - name: publish
        run: uv publish --trusted-publishing always dist/*
