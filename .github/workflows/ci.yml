name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  type:
    name: type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra pandas --extra plot --extra io --extra econ --extra torch
      - run: uv run mypy src tests tools benchmarks

  test:
    name: test (py${{ matrix.python-version }})
    needs: [lint, type]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev --extra pandas --extra plot --extra io --extra econ --extra torch
      - run: uv run pytest tests/unit -m "not parity and not slow and not gpu"
          --cov=fdatools --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  parity:
    name: parity
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra pandas --extra plot --extra io --extra econ --extra torch
      # Golden files (tests/golden/*.json) are pre-generated by tools/make_golden.py
      # and committed -- R/rpy2 is not needed to run parity tests, only to regenerate
      # golden files.
      - run: uv run pytest tests/unit/test_golden_schema.py tests/parity -m parity
      # Re-runs the parity suite with error measurement and fails on any
      # non-xfail mismatch; the report is kept as a build artifact.
      - run: uv run python tools/parity_report.py --output PARITY_REPORT.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: PARITY_REPORT.md
          if-no-files-found: error

  bench:
    name: bench
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra pandas --extra plot --extra io --extra econ --extra torch
      - run: uv run pytest benchmarks --benchmark-only --benchmark-json=benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmark.json
          if-no-files-found: ignore

  docs:
    name: docs
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra pandas --extra plot --extra io --extra econ --extra torch
      - run: uv run mkdocs build --strict

  notebooks:
    name: notebooks
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra pandas --extra plot --extra io --extra econ --extra torch
      # Assemble notebooks/book_figures.ipynb from the chapter files and check the
      # chapter contract (figure numbering, every figure cell ends in `fig`).
      - run: uv run python tools/build_book_notebook.py
      # Executing the notebook downloads every dataset that is not shipped in the
      # package from the `data-v1` GitHub release. A human still has to upload
      # those release assets (docs/dev/data-release.md); until then this step
      # fails with a download error on the first such dataset.
      - run: uv run pytest --nbmake notebooks/book_figures.ipynb
        env:
          MPLBACKEND: Agg

  build:
    name: build
    needs: [test, parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra pandas --extra plot --extra io --extra econ --extra torch
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  wheel-smoke:
    name: wheel smoke test (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      # A clean venv with only the wheel and its declared dependencies: catches
      # missing package data (src/fdatools/_data), py.typed or an undeclared import.
      - run: uv venv --python ${{ matrix.python-version }} /tmp/smoke
      - run: uv pip install --python /tmp/smoke/bin/python dist/*.whl
      - working-directory: /tmp
        run: >
          /tmp/smoke/bin/python -c "import importlib.resources as r, numpy as np, fdatools as fdt;
          g = fdt.datasets.load_growth(); b = fdt.BSpline(domain=(1.0, 18.0), n_basis=12);
          c = np.linalg.lstsq(b(g.age), g.hgtf, rcond=None)[0];
          assert fdt.FData(c, b).n_curves == 54;
          assert r.files('fdatools').joinpath('py.typed').is_file();
          print('fdatools', fdt.__version__, 'OK')"

  audit:
    name: audit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra pandas --extra plot --extra io --extra econ --extra torch
      # Skip the project itself (it is not on PyPI) and use the OSV database, so the
      # audit does not depend on pypi.org being up.
      - run: uv run pip-audit --skip-editable --vulnerability-service osv
