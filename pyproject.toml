[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fdatools"
version = "1.1.0"
description = "Functional data analysis for Python: a clean-room rewrite of R's fda package."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Hamed Davodi", email = "hamed.davodi94@gmail.com" }]
keywords = ["functional data analysis", "fda", "splines", "smoothing", "fpca", "econometrics", "panel data"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "array-api-compat>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
pandas = ["pandas>=2.2", "xarray>=2024.1"]
plot = ["matplotlib>=3.8"]
io = ["rdata>=0.11"]
# Econometrics / FDA ecosystem bridges used by fdatools.interop (tests and tutorial).
econ = ["pandas>=2.2", "statsmodels>=0.14", "linearmodels>=6.0", "scikit-fda>=0.9"]
# Only for tools/make_golden.py (it falls back to Rscript without it). Needs R to build.
golden = ["rpy2>=3.5"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-benchmark>=4.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyright>=1.1.403",
  "nbmake>=1.5",
  "jupyter>=1.0",
  # MkDocs 2.0 drops the plugin system that mkdocs-material and mkdocstrings need.
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "build>=1.2",
  "twine>=5.0",
  "pip-audit>=2.7",
  "pandas-stubs>=2.2",
  "scipy-stubs>=1.14; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/hameddavodi/fdatools"
Documentation = "https://hameddavodi.github.io/fdatools"
Source = "https://github.com/hameddavodi/fdatools"
Issues = "https://github.com/hameddavodi/fdatools/issues"
Changelog = "https://github.com/hameddavodi/fdatools/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/fdatools"]

[tool.hatch.build.targets.sdist]
include = ["src/fdatools", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools", "benchmarks"]
# Markdown is documentation, not source: SPEC.md/WORKFLOW.md snippets are illustrative
# API sketches and must not be rewritten by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D", "ANN", "S", "PT", "NPY"]
ignore = ["D203", "D213", "ANN401", "S101", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S", "PT011"]
"benchmarks/**" = ["D", "ANN"]
"tools/**" = ["S603", "S607"]
"notebooks/**" = ["D", "ANN", "E402", "B018"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
# 3.12 because numpy >= 2.3 ships stubs written with PEP 695 `type` statements that
# mypy refuses to parse under an older target. Runtime support stays >= 3.10; ruff
# target-version = "py310" is what guards against newer syntax in our own sources.
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["array_api_compat.*", "sklearn.*", "matplotlib.*", "torch.*", "rdata.*", "xarray.*", "hypothesis.*", "rpy2.*", "skfda.*", "statsmodels.*", "linearmodels.*"]
ignore_missing_imports = true

[tool.pyright]
# Pyright backs the editor/agent language server: code intelligence (jump-to-def,
# references, document symbols) plus fast control-flow checks. `mypy --strict` stays
# the authoritative type gate in CI -- pyright is tuned here NOT to re-report what
# mypy and ruff already own, so that what it does say is signal rather than noise.
#
# venvPath/venv are the load-bearing lines: without them pyright resolves no project
# import at all and every numpy/scipy/sklearn call cascades into a phantom error.
venvPath = "."
venv = ".venv"
# 3.12 for the same reason as [tool.mypy]: numpy >= 2.3 ships stubs written with PEP
# 695 `type` statements. Runtime support stays >= 3.10, guarded by ruff py310.
pythonVersion = "3.12"
# Every directory ruff lints, so code intelligence works outside src/ too.
include = ["src", "tests", "tools", "benchmarks"]
exclude = [
  "**/__pycache__",
  "**/.ruff_cache",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/.hypothesis",
  ".venv",
  "notebooks",
  "data_export",
  "data_release",
  "tests/golden",
]
typeCheckingMode = "standard"
# `ignore` suppresses diagnostics but STILL indexes these files, so jump-to-definition
# and find-references keep working across the tests. (`exclude` would drop them from the
# index entirely and break code intelligence.) Tests, tools and benchmarks are
# deliberately unannotated -- ruff already exempts them via per-file-ignores ANN --
# so type-checking them yields noise, not signal.
ignore = ["tests", "tools", "benchmarks"]
# Already enforced by ruff: F401 unused import, F841 unused local.
reportUnusedImport = "none"
reportUnusedVariable = "none"
# Already handled by [[tool.mypy.overrides]] ignore_missing_imports.
reportMissingTypeStubs = "none"
# The checks that earn their place: control-flow faults mypy --strict does not
# report by default. reportPossiblyUnbound caught a real UnboundLocalError path
# in smoothing._smooth_irregular that no grep or AST scan can see.
reportPossiblyUnboundVariable = "error"
reportUnboundVariable = "error"
# Known, accepted false positives: sklearn's `validate_data` declares a union return type
# that includes the `"no_validation"` sentinel string, so pyright thinks `.shape`/`.T` may
# be attribute access on `str` at 3 call sites (decomposition._as_fdata, Smoother.fit).
# mypy sidesteps this via ignore_missing_imports for sklearn.*. The rule stays ON because
# it catches real faults elsewhere -- it flagged a genuine bad attribute in io.py.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "parity: golden-file parity tests against R fda 6.3.0",
  "slow: long-running tests",
  "gpu: requires CUDA",
  "network: hits the real network, skipped by default",
]
filterwarnings = ["error::DeprecationWarning:fdatools.*"]

[tool.coverage.run]
source = ["fdatools"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "@overload"]
